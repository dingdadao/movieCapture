port: 7890
socks-port: 7891
allow-lan: true
mode: Rule
log-level: info
external-controller: :9090
proxies:
  - {name: "local_mgtv", server: 192.168.50.200, port: 8888, type: http}
  - {name: "socks_mgtv", server: 192.168.50.200, port: 8889, type: socks5}
proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - DIRECT
      - local_mgtv
      - socks_mgtv

rules:
  - DOMAIN-SUFFIX,mgtv.com,🚀 节点选择
  - DOMAIN,imgo.tv,🚀 节点选择
  - DOMAIN-SUFFIX,hitv.com,🚀 节点选择
  - DOMAIN-SUFFIX,kltb.com,🚀 节点选择
  - DOMAIN-SUFFIX,kltb.com.cn,🚀 节点选择
  - DOMAIN-SUFFIX,msg-kf.imgo.tv,🚀 节点选择
  - DOMAIN-SUFFIX,hitv.com,🚀 节点选择
  - DOMAIN-SUFFIX,hunantv.com,🚀 节点选择
  - DOMAIN-SUFFIX,tazai.com,🚀 节点选择
  - DOMAIN-SUFFIX,api.songzhaopian.com,🚀 节点选择
  - MATCH,DIRECT