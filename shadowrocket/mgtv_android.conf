port: 7890
socks-port: 7891
allow-lan: true
mode: Rule
log-level: info
external-controller: :9090
proxies:
  - {name: "local_mgtv", server: 172.31.28.221, port: 8888, type: http}
proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - DIRECT
      - local_mgtv

rules:
  - DOMAIN-SUFFIX,mgtv.com,local_mgtv
  - DOMAIN,imgo.tv,local_mgtv
  - DOMAIN-SUFFIX,hitv.com,local_mgtv
  - DOMAIN-SUFFIX,kltb.com.cn,local_mgtv
  - DOMAIN-SUFFIX,hitv.com,local_mgtv
  - DOMAIN-SUFFIX,hunantv.com,local_mgtv
  - DOMAIN-SUFFIX,tazai.com,local_mgtv
  - DOMAIN-SUFFIX,api.songzhaopian.com,local_mgtv
  - MATCH,DIRECT